name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: "Native runner Perl (no setup step)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no "Set up Perl" step: GitHub-hosted runners ship a
      # system Perl; there is nothing to install, download, or pin.
      - name: Show interpreter
        run: perl -v

      - name: Syntax-check the script
        run: perl -c sigilmd.pl

      - name: Run test suite
        run: perl t/run.pl

  time-travel:
    name: "Perl ${{ matrix.perl }} (unmodified source, ${{ matrix.year }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - perl: "5.8"
            year: "~2006"
            image: "perl:5.8-buster"
          - perl: "5.10"
            year: "~2008"
            image: "perl:5.10-buster"
          - perl: "5.14"
            year: "~2011"
            image: "perl:5.14-buster"
          - perl: "5.20"
            year: "~2014"
            image: "perl:5.20-buster"
          - perl: "5.26"
            year: "~2017"
            image: "perl:5.26-buster"
          - perl: "5.32"
            year: "~2020"
            image: "perl:5.32"
          - perl: "5.36"
            year: "~2022"
            image: "perl:5.36"
          - perl: "latest"
            year: "today"
            image: "perl:latest"
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter
        run: perl -v

      - name: Run test suite
        run: perl t/run.pl

  self-test:
    name: "Composite action, end to end (dogfooding)"
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Stage a fixture workspace
        run: |
          mkdir -p work/assets
          cp t/fixtures/demo/README.before.md work/README.md
          cp t/fixtures/demo/assets/intro.md work/assets/intro.md

      - name: Run sigilmd via the composite action
        uses: ./
        with:
          file: work/README.md
          commit: "false"

      - name: Compare against the documented fixture output
        run: diff t/fixtures/demo/README.after.md work/README.md

      - name: Second run must be a no-op (idempotency)
        uses: ./
        with:
          file: work/README.md
          check: "true"
          commit: "false"

  # No "docs-fresh" self-dogfooding job here, unlike treegen2/sigilbadges:
  # this README's own marker examples are sigilmd's *documentation*, not
  # live content sigilmd generates on itself, and it also carries real
  # sigilbadges `badge:` markers — sigilmd's own scanner has no notion of
  # marker ownership and hard-errors on any `<!--[[ ... ]]-->` it doesn't
  # recognize as its own grammar. tree-fresh/badges-fresh below cover the
  # content that actually IS generated into this README.

  tree-fresh:
    name: "README project-structure tree is current (via treegen2)"
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      # The README's "Project structure" section is generated by treegen2's
      # own action, not this repo's code — check mode here just confirms
      # nobody edited the tree SVG or the repo layout without re-running it.
      - name: Verify the README tree is current
        uses: lucianofedericopereira/treegen2@main
        with:
          readme: "README.md"
          check: "true"
          commit: "false"

  badges-fresh:
    name: "README badges are current (via sigilbadges)"
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      # The README's badges are generated by sigilbadges' own action, not
      # this repo's code — check mode here just confirms nobody hand-edited
      # assets/badges/*.svg or the marker specs in README.md.
      - name: Verify README badges are current
        uses: lucianofedericopereira/sigilbadges@main
        with:
          file: "README.md"
          check: "true"
          commit: "false"
